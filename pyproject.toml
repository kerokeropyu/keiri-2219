[project]
name = "keiri-2219"
version = "0.1.0"
description = "経理の2219処理を行うCUIツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1.5"]

[project.scripts]
keiri-2219 = "keiri_2219.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pyinstaller>=6.22.3",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keiri_2219"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]
